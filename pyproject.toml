[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pinkongpicture"
version = "0.1.0"
description = "Local packaging inspection and reviewed Excel records"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi", "uvicorn", "jinja2", "python-multipart",
  "pillow", "openpyxl", "pydantic>=2",
]

[project.optional-dependencies]
ocr = ["paddleocr==3.7.0", "paddlepaddle==3.3.0"]
dev = ["pytest", "httpx", "ruff"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["real_ocr: real CPU model smoke test; requires installed models"]
addopts = "-ra --basetemp=.cache/pytest"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
